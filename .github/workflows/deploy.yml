# Push to main = the game is live on GitHub Pages.
#
# The build is pushed to a `gh-pages` branch, which GitHub publishes on its own the moment
# the branch exists — no Pages setting has to be found and switched first.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository name is the path the site is served under.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages serves 404.html for any unknown path; the app is one page, so it is the page.
      - run: cp dist/asda/browser/index.html dist/asda/browser/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/asda/browser
          force_orphan: true
